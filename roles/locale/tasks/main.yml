- name: Ensure locales
  become: true
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop:
    - en_US.UTF-8
    - en_GB.UTF-8

- name: Set locale
  become: true
  ansible.builtin.command:
    argv:
      - /usr/bin/localectl
      - set-locale
      - en_GB.UTF-8
  changed_when: false
