- name: Install Packages | Arch
  community.general.pacman:
    pkg:
      - sudo
      - tmux
      - git
      - vim
      - neovim
      - ranger
      - htop
      - nmap
      - ncdu
      - make
      - python-pip
      - python-setuptools
      - iotop
      - bind
      - rsync
      - curl
      - kitty-terminfo

- name: Create the `aur_builder` user | Arch
  ansible.builtin.user:
    name: aur_builder
    create_home: true
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password | Arch
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    create: true
    validate: "visudo -cf %s"

- name: Install AUR Helper | Arch
  kewlfft.aur.aur:
    name: yay
    state: present
  become: true
  become_user: aur_builder
