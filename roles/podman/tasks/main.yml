- name: Install Podman | Debian
  when: ansible_facts['os_family']|lower == 'debian'
  become: true
  ansible.builtin.apt:
    pkg:
      - podman
      - systemd-container

- name: Install Podman | Fedora
  when: ansible_facts['os_family']|lower == 'redhat'
  become: true
  ansible.builtin.dnf:
    pkg:
      - podman
      - systemd-container

- name: Install Podman | Alpine
  when: ansible_facts['os_family']|lower == 'alpine'
  become: true
  community.general.apk:
    name:
      - podman
