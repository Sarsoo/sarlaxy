[global]
repo1-block=y
repo1-bundle=y
repo1-path=/var/lib/pgbackrest
repo1-retention-full={{ postgres_pgbackrest_retention_full }}
repo1-retention-diff={{ postgres_pgbackrest_retention_diff }}
repo1-retention-archive-type={{ postgres_pgbackrest_retention_archive_type }}
repo1-retention-archive={{ postgres_pgbackrest_retention_archive }}
#repo1-cipher-pass=...
#repo1-cipher-type=aes-256-cbc

[main]
pg1-path=/var/lib/postgresql/{{ postgres_info.version.major }}/main
